name: Publish landing GIF fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gif.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-landing-gif-fallback
  cancel-in-progress: true

env:
  RELEASE_TAG: landing-media
  RELEASE_BASE: https://github.com/parsij/3d-gold-coin/releases/download/landing-media

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download current landing video
        run: |
          curl --fail --location --retry 4 --retry-delay 2 \
            --output coin-medium.mp4 \
            "${RELEASE_BASE}/coin-medium.mp4"
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            coin-medium.mp4

      - name: Convert video to looping GIF
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i coin-medium.mp4 \
            -filter_complex "[0:v]fps=24,scale=480:480:flags=lanczos,split[g0][g1];[g0]palettegen=max_colors=192:stats_mode=diff[p];[g1][p]paletteuse=dither=sierra2_4a" \
            -loop 0 \
            coin-fallback.gif

          test -s coin-fallback.gif
          echo "GIF bytes: $(stat -c%s coin-fallback.gif)"

      - name: Upload GIF to landing-media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" coin-fallback.gif --clobber
