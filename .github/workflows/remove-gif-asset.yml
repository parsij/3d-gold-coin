name: Remove obsolete GIF release asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-gif-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove GIF and refresh manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: landing-media
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          gif_id="$(jq -r '.assets[] | select(.name == "coin-fallback.gif") | .id' <<<"$release_json" | head -n1)"

          if [[ -n "$gif_id" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${gif_id}"
          fi

          manifest_url="$(jq -r '.assets[] | select(.name == "coin-media.json") | .browser_download_url' <<<"$release_json" | head -n1)"
          if [[ -n "$manifest_url" ]]; then
            curl --fail --location "$manifest_url" -o coin-media.json
            jq 'del(.fallbackGif)' coin-media.json > coin-media.clean.json
            mv coin-media.clean.json coin-media.json
            gh release upload "$RELEASE_TAG" coin-media.json --clobber --repo "$GITHUB_REPOSITORY"
          fi
